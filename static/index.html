<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Выбор мест</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --text:#1c2733; --muted:#7b8794;
    --free:#c6efce; --free-b:#3faf5c; --busy:#ffc7ce; --busy-b:#e05265;
    --group:#d9d9d9; --group-b:#a9a9a9; --mine:#9ec9ff; --mine-b:#2f7fe0;
    --accent:#2f7fe0;
    --seat: clamp(22px, 7vw, 36px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg); color:var(--text); padding-bottom:92px}
  header{position:sticky; top:0; z-index:10; background:var(--card);
         padding:12px 16px; box-shadow:0 1px 4px rgba(0,0,0,.08)}
  header h1{margin:0; font-size:17px}
  header p{margin:4px 0 0; font-size:13px; color:var(--muted)}

  .panel{background:var(--card); margin:12px 12px 0; border-radius:12px;
         padding:14px; box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .panel h2{margin:0 0 10px; font-size:15px}
  .field{margin-bottom:10px}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px}
  .field input{width:100%; padding:10px 12px; font-size:15px; border:1px solid #d6dbe1;
               border-radius:8px; outline:none; background:#fff; color:var(--text)}
  .field input:focus{border-color:var(--accent)}
  .row{display:flex; gap:10px}
  .row .field{flex:1}

  button.primary{width:100%; padding:12px; font-size:15px; font-weight:600;
                 border:none; border-radius:10px; background:var(--accent);
                 color:#fff; cursor:pointer}
  button.primary:disabled{background:#b9c6d6; cursor:default}
  button.ghost{margin-top:8px; width:100%; padding:10px; font-size:14px;
               border:1px solid #d6dbe1; border-radius:10px; background:#fff;
               color:var(--text); cursor:pointer}
  button.ghost:disabled{color:#b0b7c0; cursor:default}

  .legend{display:flex; flex-wrap:wrap; gap:10px 16px; margin:12px 12px 0;
          background:var(--card); border-radius:12px; padding:10px 14px;
          font-size:12px; color:var(--muted)}
  .legend span{display:flex; align-items:center; gap:6px; white-space:nowrap}
  .dot{width:14px; height:14px; border-radius:4px; display:inline-block;
       border:1.5px solid transparent}
  .dot.free{background:var(--free); border-color:var(--free-b)}
  .dot.busy{background:var(--busy); border-color:var(--busy-b)}
  .dot.mine{background:var(--mine); border-color:var(--mine-b)}
  .dot.group{background:var(--group); border-color:var(--group-b)}

  .hall-wrap{margin:12px 12px 0; background:var(--card); border-radius:12px;
             padding:12px 8px 16px; overflow:hidden}
  .scene{font-size:11px; letter-spacing:3px; text-align:center; color:var(--muted);
         border-bottom:2px solid #c8d0d9; padding-bottom:8px; margin:0 12px 12px}
  .hall-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; padding:4px 2px}
  .hall{min-width:max-content; margin:0 auto}

  .zone-title{font-size:11px; color:var(--muted); text-align:center;
              margin:8px 0 4px; letter-spacing:1px}
  .row-line{display:flex; align-items:center; gap:6px; margin:5px auto; width:max-content}
  .row-num{width:22px; text-align:right; font-size:11px; color:var(--muted);
           flex:none; user-select:none}
  .seat{width:var(--seat); height:var(--seat); border-radius:7px;
        border:1.5px solid transparent; font-size:9px; line-height:1;
        display:flex; align-items:center; justify-content:center;
        user-select:none; transition:transform .08s}
  .seat.free{background:var(--free); border-color:var(--free-b); cursor:pointer}
  .seat.busy{background:var(--busy); border-color:var(--busy-b); cursor:not-allowed}
  .seat.mine{background:var(--mine); border-color:var(--mine-b); cursor:pointer}
  .seat.group{background:var(--group); border-color:var(--group-b); cursor:not-allowed}
  .seat.selected{outline:2.5px solid #1c2733; outline-offset:1px}
  .seat.free:active,.seat.mine:active{transform:scale(.9)}

  .bar{position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--card);
       padding:10px 14px calc(10px + env(safe-area-inset-bottom));
       box-shadow:0 -2px 8px rgba(0,0,0,.08);
       display:flex; align-items:center; gap:12px}
  .bar .info{font-size:13px; flex:1; min-width:0}
  .bar .info b{font-size:15px}
  .bar button{flex:none; padding:11px 18px; font-size:14px; font-weight:600;
              border:none; border-radius:10px; background:var(--accent); color:#fff;
              cursor:pointer}
  .bar button:disabled{background:#b9c6d6; cursor:default}

  .toast{position:fixed; left:50%; bottom:76px; transform:translateX(-50%);
         background:#2b3542; color:#fff; padding:10px 16px; border-radius:10px;
         font-size:13px; z-index:20; max-width:88vw; text-align:center}
  .scroll-hint{display:none; text-align:center; font-size:11px; color:var(--muted);
               margin-top:8px}
  @media (max-width:600px){ .scroll-hint{display:block} }
</style>
</head>
<body>

<header>
  <h1>Театр — выбор мест</h1>
  <p id="who">Загрузка…</p>
</header>

<div class="panel" id="profilePanel">
  <h2>Профиль</h2>
  <form id="profileForm">
    <div class="field"><label>ФИО</label>
      <input name="fio" required placeholder="Иванов Иван"></div>
    <div class="row">
      <div class="field"><label>Курс</label>
        <input name="course" required placeholder="1"></div>
      <div class="field"><label>Группа</label>
        <input name="grp" required placeholder="МТО-101"></div>
    </div>
    <button class="primary" type="submit">Сохранить профиль</button>
  </form>
</div>

<div class="legend">
  <span><i class="dot free"></i>свободно</span>
  <span><i class="dot busy"></i>занято</span>
  <span><i class="dot mine"></i>ваше</span>
  <span><i class="dot group"></i>группа / балкон</span>
</div>

<div class="hall-wrap">
  <div class="scene">С Ц Е Н А</div>
  <div class="hall-scroll"><div class="hall" id="hall"></div></div>
  <div class="scroll-hint">↔ прокрутите вбок, чтобы увидеть весь зал</div>
</div>

<div class="bar">
  <div class="info">Выбрано: <b id="selCount">0</b> / <span id="maxSeats">4</span></div>
  <button id="bookBtn" disabled>Забронировать</button>
  <button id="cancelBtn" disabled style="background:#e05265">Отменить</button>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
}

const authHeaders = {
  "X-Telegram-Init-Data": (tg && tg.initData) ? tg.initData : ""
};

let state = null;      // {seats, max_seats, user_id, test_mode}
let selected = new Set();   // ключи "section|row|seat" выбранных свободных
let mineSelected = new Set(); // ключи ваших мест для отмены

const $ = s => document.querySelector(s);
const keyOf = s => s.section + "|" + s.row + "|" + s.seat;

function toast(msg){
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

async function api(path, options = {}){
  const res = await fetch(path, {
    ...options,
    headers: { ...authHeaders, ...(options.headers || {}) }
  });
  if (!res.ok){
    let msg = "Ошибка " + res.status;
    try { msg = (await res.json()).detail || msg; } catch(e){}
    throw new Error(msg);
  }
  return res.json();
}

function renderWho(){
  const el = $("#who");
  if (!state){ el.textContent = "Не удалось загрузить данные"; return; }
  if (state.test_mode){
    el.textContent = "Тестовый режим — без Telegram-авторизации";
  } else if (state.user_id){
    el.textContent = "Вы вошли: id " + state.user_id;
  } else {
    el.textContent = "Откройте через кнопку в боте";
  }
}

function renderProfile(p){
  const f = $("#profileForm");
  if (p && p.fio){
    f.fio.value = p.fio; f.course.value = p.course; f.grp.value = p.grp;
  }
}

function zoneTitle(text){
  const d = document.createElement("div");
  d.className = "zone-title";
  d.textContent = text;
  return d;
}

function renderHall(){
  const hall = $("#hall");
  hall.innerHTML = "";
  if (!state) return;

  const byKey = {};
  for (const s of state.seats) byKey[keyOf(s)] = s;

  const zones = [
    ["Партер — гостевые ряды", s => s.section === "parter" && (s.status === "free" || s.status === "busy" || s.status === "mine")],
    ["Партер — ряды групп",    s => s.section === "parter" && s.status === "group"],
    ["Балкон",                 s => s.section === "balcony"]
  ];

  // Сгруппировать по (зона, ряд), чтобы вывести ряды по порядку
  const rows = {};
  for (const s of state.seats){
    const zi = zones.findIndex(([, fn]) => fn(s));
    const rk = zi + "|" + s.section + "|" + s.row;
    (rows[rk] = rows[rk] || {zone: zi, row: s.row, seats: []}).seats.push(s);
  }

  const order = Object.values(rows).sort((a, b) => a.zone - b.zone || Number(a.row) - Number(b.row));

  let lastZone = -1;
  for (const r of order){
    if (r.zone !== lastZone){
      hall.appendChild(zoneTitle(zones[r.zone][0]));
      lastZone = r.zone;
    }
    const line = document.createElement("div");
    line.className = "row-line";
    const num = document.createElement("div");
    num.className = "row-num";
    num.textContent = r.row;
    line.appendChild(num);
    for (const s of r.seats){
      const d = document.createElement("div");
      d.className = "seat " + s.status;
      d.textContent = s.seat;
      d.title = "Ряд " + s.row + ", место " + s.seat;
      const k = keyOf(s);
      if (selected.has(k) || mineSelected.has(k)) d.classList.add("selected");
      if (s.status === "free" || s.status === "mine"){
        d.addEventListener("click", () => toggleSeat(s));
      }
      line.appendChild(d);
    }
    hall.appendChild(line);
  }

  $("#selCount").textContent = selected.size;
  $("#maxSeats").textContent = state.max_seats;
  $("#bookBtn").disabled = selected.size === 0;
  $("#cancelBtn").disabled = mineSelected.size === 0;
}

function toggleSeat(s){
  const k = keyOf(s);
  if (s.status === "free"){
    if (selected.has(k)) selected.delete(k);
    else {
      if (selected.size >= state.max_seats){
        toast("Не больше " + state.max_seats + " мест за раз");
        return;
      }
      selected.add(k);
    }
  } else if (s.status === "mine"){
    if (mineSelected.has(k)) mineSelected.delete(k);
    else mineSelected.add(k);
  }
  renderHall();
}

async function loadState(){
  try {
    state = await api("/api/state");
    selected.clear();
    mineSelected.clear();
    renderWho();
    renderHall();
  } catch(e){
    toast("Не удалось загрузить схему: " + e.message);
  }
}

async function loadProfile(){
  try {
    const p = await api("/api/profile");
    renderProfile(p);
  } catch(e){ /* не авторизован — просто пустая форма */ }
}

$("#profileForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const f = ev.target;
  try {
    await api("/api/profile", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({fio: f.fio.value, course: f.course.value, grp: f.grp.value})
    });
    toast("Профиль сохранён");
  } catch(e){
    toast("Ошибка: " + e.message);
  }
});

$("#bookBtn").addEventListener("click", async () => {
  if (!selected.size) return;
  const first = [...selected][0].split("|");
  const seats = [...selected].map(k => Number(k.split("|")[2]));
  const body = {section: first[0], row: first[1], seats};
  try {
    await api("/api/book", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });
    toast("Забронировано мест: " + seats.length);
    await loadState();
  } catch(e){
    toast("Ошибка: " + e.message);
    await loadState();
  }
});

$("#cancelBtn").addEventListener("click", async () => {
  if (!mineSelected.size) return;
  const first = [...mineSelected][0].split("|");
  const seats = [...mineSelected].map(k => Number(k.split("|")[2]));
  const body = {section: first[0], row: first[1], seats};
  try {
    await api("/api/book", {
      method: "DELETE",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });
    toast("Отменено мест: " + seats.length);
    await loadState();
  } catch(e){
    toast("Ошибка: " + e.message);
    await loadState();
  }
});

loadProfile();
loadState();
setInterval(loadState, 30000); // автообновление занятости каждые 30 секунд
</script>
</body>
</html>
