<html lang="ru">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выбор мест</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 12px; background: #121212; color: #e0e0e0; -webkit-font-smoothing: antialiased; }
  /* ОКНО ПРИЛОЖЕНИЯ: на широких экранах контент не растягивается, а держится в центре шириной 460px */
  .app { max-width: 460px; margin: 0 auto; }
  h2 { margin: 20px 0 10px; font-size: 15px; color: #888; text-align: center; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
  .stage { text-align: center; background: linear-gradient(180deg, #2a2a2a, #1a1a1a); color: #fff; padding: 8px; border-radius: 8px; margin: 12px 0; letter-spacing: 4px; font-size: 12px; font-weight: bold; border: 1px solid #333; box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05); }
  .row { display: flex; align-items: center; margin: 4px auto; gap: 4px; width: max-content; }
  .row-num { width: 24px; font-size: 11px; color: #666; text-align: right; flex-shrink: 0; font-weight: 600; }
  .row-num.right { text-align: left; }
  .seat { width: 22px; height: 22px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.1); font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; flex-shrink: 0; transition: all 0.2s ease; font-weight: 600; color: rgba(255,255,255,0.9); }
  .seat:active { transform: scale(0.9); }
  .seat.free { background: #2e7d32; border-color: #4caf50; box-shadow: 0 0 6px rgba(76, 175, 80, 0.4); }
  .seat.free:hover { box-shadow: 0 0 12px rgba(76, 175, 80, 0.8); background: #388e3c; }
  .seat.busy { background: #c62828; border-color: #ef5350; box-shadow: 0 0 6px rgba(239, 83, 80, 0.3); cursor: not-allowed; opacity: 0.6; }
  .seat.mine { background: #1976d2; border-color: #42a5f5; box-shadow: 0 0 8px rgba(66, 165, 245, 0.6); }
  .seat.selected { outline: 2px solid #ffd54f; outline-offset: 2px; z-index: 10; box-shadow: 0 0 10px rgba(255, 213, 79, 0.8); }
  .seat.group { cursor: not-allowed; border: 1px solid rgba(255,255,255,0.05); color: #000; font-weight: 800; opacity: 0.9; }
  
  /* Точные цвета групп */
  .g-red { background: #e03131; color: #fff; box-shadow: 0 0 6px rgba(224, 49, 49, 0.4); }       /* ГУП-1 */
  .g-teal { background: #0ca678; color: #fff; box-shadow: 0 0 6px rgba(12, 166, 120, 0.4); }      /* ГУП-2 */
  .g-orange { background: #f08c00; color: #fff; box-shadow: 0 0 6px rgba(240, 140, 0, 0.4); }     /* ГУП-3 */
  .g-blue { background: #1971c2; color: #fff; box-shadow: 0 0 6px rgba(25, 113, 194, 0.4); }      /* ГУП-4 */
  .g-green { background: #2f9e44; color: #fff; box-shadow: 0 0 6px rgba(47, 158, 68, 0.4); }      /* ГУП-5 */
  .g-brown { background: #8d5537; color: #fff; box-shadow: 0 0 6px rgba(141, 85, 55, 0.4); }      /* ГУЭ-1 */
  .g-pink { background: #e64980; color: #fff; box-shadow: 0 0 6px rgba(230, 73, 128, 0.4); }      /* ГУЭ-2 */
  .g-purple { background: #9c36b5; color: #fff; box-shadow: 0 0 6px rgba(156, 54, 181, 0.4); }    /* УИР-1 */
  .g-lime { background: #82c91e; box-shadow: 0 0 6px rgba(130, 201, 30, 0.4); }                   /* УИР-2 */
  .g-gray { background: #495057; color: #fff; box-shadow: 0 0 6px rgba(73, 80, 87, 0.4); }        /* Остальное */

  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; font-size: 12px; margin: 16px 0; color: #aaa; }
  .dot { width: 14px; height: 14px; border-radius: 4px; display: inline-block; margin-right: 6px; vertical-align: middle; border: 1px solid rgba(255,255,255,0.2); }
  
  .form { background: #1e1e1e; padding: 16px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); border: 1px solid #333; }
